<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOOLS-AI</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f5f7fb;
      color:#111827;
    }
    header{
      background:#111827;
      color:white;
      padding:25px 18px;
      text-align:center;
    }
    header h1{margin:0;font-size:30px}
    header p{margin:8px 0 0;color:#cbd5e1}
    .container{
      max-width:700px;
      margin:25px auto;
      padding:0 16px;
    }
    .card{
      background:white;
      padding:20px;
      margin-bottom:18px;
      border-radius:16px;
      box-shadow:0 4px 15px #00000012;
    }
    textarea{
      width:100%;
      min-height:140px;
      padding:14px;
      border:1px solid #d1d5db;
      border-radius:12px;
      font-size:16px;
      resize:vertical;
    }
    button{
      width:100%;
      margin-top:12px;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#111827;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }
    button:hover{opacity:.9}
    #hasil{
      margin-top:18px;
      padding:15px;
      background:#f1f5f9;
      border-radius:12px;
      min-height:50px;
      white-space:pre-wrap;
    }
    footer{
      text-align:center;
      padding:25px;
      color:#64748b;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 TOOLS-AI</h1>
  <p>Kumpulan tools AI sederhana</p>
</header>

<div class="container">

  <div class="card">
    <h2>✨ AI Assistant</h2>
    <p>Tulis pertanyaan atau perintah kamu:</p>

    <textarea id="prompt" placeholder="Contoh: Buatkan ide nama bisnis..."></textarea>

    <button onclick="prosesAI()">🚀 Jalankan AI</button>

    <div id="hasil">Hasil akan muncul di sini...</div>
  </div>

</div>

<footer>
  © 2026 TOOLS-AI
</footer>

<script>
function prosesAI(){
  const prompt = document.getElementById("prompt").value.trim();
  const hasil = document.getElementById("hasil");

  if(!prompt){
    hasil.innerText = "⚠️ Silakan tulis pertanyaan terlebih dahulu.";
    return;
  }

  hasil.innerText =
    "✅ Permintaan diterima!\n\n" +
    "Kamu menulis:\n" + prompt +
    "\n\n⚠️ AI API belum dihubungkan.";
}
</script>

</body>
</html>
